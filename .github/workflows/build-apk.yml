name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend address the app should talk to, e.g. http://192.168.1.20:3000 or https://api.example.com"
        required: true
        type: string
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and apply audio/background settings
        working-directory: app
        run: |
          flutter create . --platforms=android --org app.spotmusic --project-name spotmusic
          python3 ../tool/patch_android.py

      - name: Build release APK
        working-directory: app
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: spotmusic-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
