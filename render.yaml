# Render Blueprint: free web service (Node) + free PostgreSQL for the SpotMusic backend.
# Deploy from the dashboard with "New Blueprint Instance" using this repo.
services:
  - type: web
    name: spotmusic-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/seed.js && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: spotmusic-db
          property: connectionString
databases:
  - name: spotmusic-db
    plan: free
